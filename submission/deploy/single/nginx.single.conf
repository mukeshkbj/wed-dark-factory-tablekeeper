# Public edge for the all-in-one demo container. __PORT__ is substituted
# by start.sh ($PORT or 80). The app listens on 127.0.0.1:18080 only.

server {
    listen __PORT__;
    server_name _;
    client_max_body_size 256k;

    # Test-control endpoints must never be reachable publicly.
    location /_test {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
