# Public edge for the Tablekeeper demo. The app container is unreachable
# from outside; this server is the only entry point.

server {
    listen 80;
    server_name _;
    client_max_body_size 256k;

    # Test-control endpoints must never be reachable publicly. The app
    # returns 404 for them in hardened mode; we enforce the same boundary
    # here so the backend can stay in seedable judge mode on the internal
    # network. Prefix match covers /_test, /_test/, and anything under it.
    location /_test {
        return 404;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
