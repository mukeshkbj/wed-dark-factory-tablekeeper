# Tablekeeper stage-4 — safe public demo stack.
#
# Threat model: the frozen product exposes test-control routes
# (/_test/reset, /_test/export, /_test/import) in its default judge mode, and
# `TK_HARDENED=1` disables them — but hardened mode also leaves the in-memory
# state empty, so a bare hardened container shows judges an empty app.
#
# This stack keeps the app in default mode on an *internal-only* network,
# seeds the synthetic demo fixture once via a one-shot job, and publishes
# ONLY an nginx proxy that blocks every /_test* path with 404. The product
# tree is unchanged.
#
# Prerequisite: deploy only on a host/domain you are authorized to use.
# Put the published port behind the host's normal TLS termination.

name: tablekeeper-demo

services:
  app:
    build: ../../stage-4
    expose:
      - "8080"          # internal network only — never published
    networks: [internal]
    restart: unless-stopped

  seed:
    build: ../../stage-4
    networks: [internal]
    depends_on:
      - app
    volumes:
      - ./seed.py:/tmp/seed.py:ro
    environment:
      APP_URL: http://app:8080
    command: ["python", "/tmp/seed.py"]
    restart: "no"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${DEMO_PORT:-8080}:80"   # the ONLY public port; set DEMO_PORT to re-map
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge        # carries the published port
      - internal    # reaches the app; no outbound access from here
    depends_on:
      - app
      - seed
    restart: unless-stopped

networks:
  internal:
    internal: true      # app/seed have no outbound access on this network
  edge: {}              # normal bridge; only the proxy is attached
